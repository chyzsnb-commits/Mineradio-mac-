name: Build macOS (arm64)

# 触发条件：推送 v* tag（发版）、手动、PR（仅验证不发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: '构建类型（stable=正式版；beta=测试版。dmg 上传到本仓库 Release，无自动更新）'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
  pull_request:
    paths:
      - 'desktop/**'
      - 'public/**'
      - '*.js'
      - 'package.json'

jobs:
  build:
    runs-on: macos-14  # Apple Silicon arm64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: npm run check

      - name: Prepare signing (adhoc fallback when no certificate)
        # 有证书 → 正式签名+公证；无证书 → adhoc（用户需右键打开）
        # 证书相关 secrets 配齐后自动启用，无需改 workflow
        run: |
          if [ -z "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK 未配置，使用 adhoc 签名（CSC_IDENTITY_AUTO_DISCOVERY=false 时 electron-builder 自动 adhoc）"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          else
            echo "CSC_LINK 已配置，启用正式签名"
          fi

      - name: Determine release type
        id: reltype
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "release_type=none" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "release_type=${{ inputs.release_type }}" >> $GITHUB_OUTPUT
          else
            # tag 触发：tag 含 beta/内部/beat 视为测试版，否则正式版
            if echo "${{ github.ref_name }}" | grep -qiE "beta|internal|beat|测试"; then
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "release_type=beta" >> $GITHUB_OUTPUT
            else
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "release_type=stable" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build (PR 验证，只解包不打包 dmg)
        if: steps.reltype.outputs.is_release != 'true'
        run: npm run build:mac:dir

      - name: Build dmg (发版构建)
        if: steps.reltype.outputs.is_release == 'true'
        env:
          # Apple 签名/公证（配置 secrets 后自动生效，否则 adhoc）
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Upload dmg to GitHub Release (手动触发发版时)
        if: steps.reltype.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ steps.reltype.outputs.release_type }}
        run: |
          # 不走 electron-updater 自动更新，只把 dmg 作为 Release 资产供手动下载
          DMG=$(find dist -name "*.dmg" | head -1)
          TAG="${{ github.ref_name }}"
          [ -z "$DMG" ] && { echo "无 dmg，跳过"; exit 0; }
          # 测试版标 pre-release
          PRE_FLAG=""
          [ "$RELEASE_TYPE" = "beta" ] && PRE_FLAG="--prerelease"
          # release 已存在就追加资产，否则创建
          gh release create "$TAG" "$DMG" --title "Mineradio $TAG" --generate-notes $PRE_FLAG 2>/dev/null \
            || gh release upload "$TAG" "$DMG" --clobber

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineradio-mac-build
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: ignore
