<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050608;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(60% 50% at 78% 60%, rgba(40,120,100,.20), transparent 60%),
      radial-gradient(50% 60% at 50% 50%, rgba(255,255,255,.03), transparent 60%),
      #050608}
  /* 斜向流光,呼应启动屏 */
  .streak{position:absolute;top:-20%;height:140%;width:42%;right:6%;
    background:repeating-linear-gradient(112deg, rgba(120,200,170,.07) 0 2px, transparent 2px 26px);
    transform:skewX(-12deg);filter:blur(.5px);opacity:.85}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .word{font-size:9vw;font-weight:600;letter-spacing:-.03em;line-height:1}
  .word .m{color:#f3f5f4}
  .word .r{background:linear-gradient(96deg,#a9c4bb 0%,#9fb9b0 40%,#d8c79f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .line{width:min(360px,30vw);height:1px;margin:3.4vh auto 0;background:linear-gradient(90deg,transparent,rgba(212,200,160,.5),transparent)}
  .sub{margin-top:2.6vh;font-size:1.5vw;letter-spacing:.5em;color:rgba(150,168,160,.62);text-transform:uppercase;padding-left:.5em}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="streak"></div>
  <div class="wrap">
    <div class="word"><span class="m">Mine</span><span class="r">radio</span></div>
    <div class="line"></div>
    <div class="sub">Private Visual Radio</div>
  </div>
</body>
</html>
